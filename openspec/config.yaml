schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Tech stack: .NET 10, ASP.NET Core, Blazor, gRPC.
  Domain: cataloging and scanning Lego Ninjago collectible cards.

  This is a single git repo / single OpenSpec root (NinjagoScanner.slnx at the root
  for the .NET projects) containing three independently runnable services:
    - NinjagoScanner.CatalogService (.NET): standalone gRPC service, owns the
      series/card catalog data (cardInfos/*.json), exposes CardCatalog/ListSeries,
      GetSeries, GetServiceInfo.
    - picture_service/ (Python, uv-managed, outside NinjagoScanner.slnx): standalone
      gRPC service, analyzes card photos via the Gemini API, owns photo storage (S3)
      and sidecar records (DynamoDB). Exposes CardPictureService/Scan, UploadPhoto,
      etc. Calls CatalogService via its own gRPC client instead of reading cardInfos
      locally.
    - NinjagoScanner.Web (.NET): Blazor web app, renders cards as tiles/table, drives
      mobile photo upload, and triggers scans by calling PictureService over gRPC.

  Specs are kept in ONE openspec/specs/ directory (per OpenSpec convention - do not
  create a separate openspec/ root per project), but capability names are prefixed
  with the owning project's short slug so specs stay cleanly separated and easy to
  filter with `openspec list`/`openspec view`:
    - catalog-service-<capability>   e.g. catalog-service-series-lookup
    - picture-service-<capability>   e.g. picture-service-gemini-scan
    - web-<capability>                e.g. web-card-table-view
  Use no prefix only for a capability that is genuinely cross-cutting/shared
  (e.g. the gRPC contracts between services), and call that out explicitly in the
  proposal's Impact section since it will span multiple projects.

