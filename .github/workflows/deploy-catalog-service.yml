name: Deploy - NinjagoScanner.CatalogService

# Task 5.1: deploy NinjagoScanner.CatalogService to Fly.io on every push to main that touches it.
# Uses fly.toml's repo-root-relative Dockerfile path (see NinjagoScanner.CatalogService/fly.toml's
# header comment) - `.` is passed explicitly as the build context so it doesn't default to the
# fly.toml's own directory.
#
# Requires a repo (or environment) secret: FLY_API_TOKEN (a Fly.io deploy token scoped to this
# app - see infra/README.md).
on:
  push:
    branches: [main]
    paths:
      - "NinjagoScanner.CatalogService/**"
      - ".github/workflows/deploy-catalog-service.yml"
  workflow_dispatch:

concurrency:
  group: deploy-catalog-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config NinjagoScanner.CatalogService/fly.toml .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
