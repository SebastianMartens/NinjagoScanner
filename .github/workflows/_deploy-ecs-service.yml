name: Reusable - Deploy Fargate service

# Shared deploy logic for CatalogService and PictureService (tasks 10.2/10.3): build the
# Dockerfile from the repo root, push to ECR, render a new task definition revision with that
# image, and update the ECS service. Called by ci-deploy-catalog-service.yml and
# ci-deploy-picture-service.yml, which each own their own path filter so the two services still
# redeploy fully independently of each other — only this step sequence is shared.
#
# Requires these repo (or environment) variables to already be set, filled in from
# `terraform output` in infra/environments/prod after it has been applied at least once:
#   AWS_REGION, ECS_CLUSTER_NAME
# and a repo secret:
#   AWS_DEPLOY_ROLE_ARN (infra's github_actions_deploy_role_arn output)

on:
  workflow_call:
    inputs:
      dockerfile-path:
        required: true
        type: string
      ecr-repository-url:
        required: true
        type: string
      ecs-service-name:
        required: true
        type: string
      container-name:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          IMAGE_URI: ${{ inputs.ecr-repository-url }}:${{ github.sha }}
        run: |
          docker build -f "${{ inputs.dockerfile-path }}" -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ inputs.ecs-service-name }}" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with the freshly pushed image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container-name }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ inputs.ecs-service-name }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
