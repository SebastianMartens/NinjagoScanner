name: Deploy - NinjagoScanner.Web

# Task 5.1: deploy NinjagoScanner.Web to Fly.io on every push to main that touches it. Uses
# fly.toml's repo-root-relative Dockerfile path (see NinjagoScanner.Web/fly.toml's header
# comment) - `.` is passed explicitly as the build context so it doesn't default to the fly.toml's
# own directory.
#
# Requires a repo (or environment) secret: FLY_API_TOKEN (a Fly.io deploy token scoped to this
# app - see infra/README.md).
on:
  push:
    branches: [main]
    paths:
      - "NinjagoScanner.Web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config NinjagoScanner.Web/fly.toml .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
