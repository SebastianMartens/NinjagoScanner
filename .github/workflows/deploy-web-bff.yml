name: Deploy - Web BFF

# Task 10.4: path-filtered build/deploy for the stateless Web BFF (NinjagoScanner.Web.Bff),
# packaged with the AWS Lambda .NET tooling and pushed via `update-function-code`. Also triggers
# on NinjagoScanner.Web.Shared changes, since the BFF project-references it.
#
# Requires these repo (or environment) variables, filled in from `terraform output` in
# infra/environments/prod once task 9's Lambda module has been applied:
#   AWS_REGION, LAMBDA_BFF_FUNCTION_NAME
# and a repo secret: AWS_DEPLOY_ROLE_ARN
on:
  push:
    branches: [main]
    paths:
      - "NinjagoScanner.Web.Bff/**"
      - "NinjagoScanner.Web.Shared/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-web-bff-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Amazon.Lambda.Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Only updates the function's code, never its configuration/role/VPC settings — those stay
      # Terraform-managed (infra/modules/bff-lambda) so this workflow can't drift them.
      - name: Package
        working-directory: NinjagoScanner.Web.Bff
        run: dotnet lambda package --configuration Release --output-package ../bff-deploy-package.zip

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_BFF_FUNCTION_NAME }}" \
            --zip-file fileb://bff-deploy-package.zip \
            --region "${{ vars.AWS_REGION }}"
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_BFF_FUNCTION_NAME }}" \
            --region "${{ vars.AWS_REGION }}"
