name: Deploy - PictureService

# Task 10.3: path-filtered build/push/deploy for PictureService. Only runs when something under
# its own project directory (or its Dockerfile) changes.
on:
  push:
    branches: [main]
    paths:
      - "NinjagoScanner.PictureService/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-picture-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # A caller workflow's permissions cap what a called reusable workflow may
    # request — without this, _deploy-ecs-service.yml's `id-token: write`
    # (needed for the AWS OIDC role assumption) gets silently downgraded to
    # `id-token: none` and the run fails at the permission-check stage.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-ecs-service.yml
    with:
      dockerfile-path: NinjagoScanner.PictureService/Dockerfile
      ecr-repository-url: ${{ vars.ECR_PICTURE_SERVICE_REPOSITORY_URL }}
      ecs-service-name: ninjago-scanner-picture-service
      container-name: picture-service
    secrets: inherit
