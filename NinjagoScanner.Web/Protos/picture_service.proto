syntax = "proto3";

option csharp_namespace = "NinjagoScanner.PictureService.Protos";

package pictureservice;

// Photo bytes live in S3 (bucket configured at the service level, not per-request) and sidecar
// records live in DynamoDB, keyed by a generated photo_id within a collection_id. Every RPC that
// reads or writes photo/sidecar data requires a collection_id (see collection-scoped-picture-access):
// PictureService validates that it refers to a collection it has recorded and never returns or
// modifies data belonging to a different collection, but does not itself re-authorize the caller -
// Web resolves and supplies the caller's authorized collection_id, since PictureService has no
// public endpoint and Web is its only caller. Callers stream photo bytes to this service via
// UploadPhoto, which assigns the generated photo_id, stores the bytes, and triggers AI Analysis.
// ListCards includes a ready-to-use download_url on every entry; GetPhotoDownloadUrl exists only
// for resolving a single photo_id a caller has in hand without a ListCards result (e.g. right
// after UploadPhoto). CardEntry only carries the fields every list/grid view needs for every row;
// GetCardDetails resolves the rest for one photo_id at a time, for callers showing a single card's
// full details (an expanded review tile, the collection detail pane). ReanalyzePhoto re-runs AI
// Analysis on a single stored photo on demand (the Review page's re-analysis button). MigrateSidecars is the one
// exception: a global, unscoped maintenance RPC that repairs legacy sidecar records across all
// collections, not a per-user product path.
service CardPictureService {
  rpc Scan (ScanRequest) returns (ScanSummary);
  rpc UploadPhoto (stream UploadPhotoRequest) returns (UploadPhotoResponse);
  rpc GetPhotoDownloadUrl (GetPhotoDownloadUrlRequest) returns (GetPhotoDownloadUrlResponse);
  rpc ListCards (ListCardsRequest) returns (ListCardsResponse);
  rpc GetCardDetails (GetCardDetailsRequest) returns (GetCardDetailsResponse);
  rpc UpdateSidecar (UpdateSidecarRequest) returns (UpdateSidecarResponse);
  rpc UpdateSetName (UpdateSetNameRequest) returns (UpdateSetNameResponse);
  rpc UpdateCardNumber (UpdateCardNumberRequest) returns (UpdateCardNumberResponse);
  rpc UpdateCardLanguage (UpdateCardLanguageRequest) returns (UpdateCardLanguageResponse);
  rpc UpdateReviewStatus (UpdateReviewStatusRequest) returns (UpdateReviewStatusResponse);
  rpc MigrateSidecars (MigrateSidecarsRequest) returns (MigrateSidecarsResponse);
  rpc DeletePhoto (DeletePhotoRequest) returns (DeletePhotoResponse);
  rpc ReanalyzePhoto (ReanalyzePhotoRequest) returns (ReanalyzePhotoResponse);
  rpc ListSourceFileNames (ListSourceFileNamesRequest) returns (ListSourceFileNamesResponse);
}

// Bulk backfill: analyzes every photo in S3 that has no sidecar record yet (or all of them, if
// overwrite_existing_sidecars is set). Mainly an admin/recovery operation now that individual
// uploads are analyzed one at a time via UploadPhoto.
message ScanRequest {
  optional string api_key = 1;
  optional string model = 2;
  optional string catalog_service_address = 3;
  optional bool overwrite_existing_sidecars = 4;
  optional int32 delay_between_requests_ms = 5;
  optional int32 retry_delay_ms = 6 [deprecated = true]; // Ignored: the Gemini SDK owns retry backoff.
  optional int32 max_attempts = 7;
  optional int32 timeout_seconds = 8;
  string collection_id = 9;
}

message ScanSummary {
  int32 total_images = 1;
  int32 processed = 2;
  int32 skipped = 3;
  int32 uncertain = 4;
  int32 failed = 5;
  bool has_configuration_error = 6;
  string message = 7;
  bool stopped_early = 8;
}

// Sidecar fields needed to render a card in a list/grid view - every row needs these, so they
// stay in the bulk ListCards response. See CardDetails for the rest.
message CardEntry {
  string photo_id = 1;
  string source_file_name = 14;
  string analysis_status = 2;
  string card_name = 3;
  string card_number = 4;
  string set_name = 5;
  string rarity = 6;
  string review_status = 12;
  string language = 13;
  string download_url = 15;
}

message ListCardsRequest {
  string collection_id = 1;
}

message ListCardsResponse {
  repeated CardEntry cards = 1;
}

// Sidecar fields only shown for a single selected/expanded card, resolved on demand via
// GetCardDetails rather than carried on every ListCards entry. `confidence`/`reasoning_summary`/
// `detected_text` (the single-call pipeline's payload fields) are retired - nothing in the
// staged analysis pipeline populates them anymore (see picture-service-staged-analysis-pipeline);
// `attributes_json` replaces them with the pipeline's actual Detected/Derived output, for
// debugging/quality checks.
message CardDetails {
  string photo_id = 1;
  reserved 2, 3, 4;
  reserved "confidence", "reasoning_summary", "detected_text";
  string scanned_at_utc = 5;
  string error_message = 6;
  string attributes_json = 7;
}

message GetCardDetailsRequest {
  string photo_id = 1;
  string collection_id = 2;
}

message GetCardDetailsResponse {
  CardDetails details = 1;
}

// Client-streaming upload: the first message on the stream carries metadata, every subsequent
// message carries a chunk of the raw file bytes (concatenated in order). The server assigns the
// generated photo_id — it is never supplied by the caller.
message UploadPhotoRequest {
  oneof payload {
    UploadPhotoMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadPhotoMetadata {
  string source_file_name = 1;
  optional string api_key = 2;
  optional string model = 3;
  optional string catalog_service_address = 4;
  optional int32 retry_delay_ms = 5 [deprecated = true]; // Ignored: the Gemini SDK owns retry backoff.
  optional int32 max_attempts = 6;
  optional int32 timeout_seconds = 7;
  string collection_id = 8;
  // When set, the photo is stored and given a notAnalyzed sidecar (carrying source_file_name) but
  // not analyzed - so neither a Gemini API key nor CatalogService is needed. Used by batch upload;
  // analysis happens later via Scan.
  optional bool skip_analysis = 9;
}

message UploadPhotoResponse {
  CardEntry card = 1;
}

// Lean listing of the source file names recorded for a collection's photos, so a caller can tell
// which files were already uploaded. Unlike ListCards it mints no download URLs and reads no photo
// objects. Names are de-duplicated; photos without a recorded name contribute nothing.
message ListSourceFileNamesRequest {
  string collection_id = 1;
}

message ListSourceFileNamesResponse {
  repeated string source_file_names = 1;
}

message GetPhotoDownloadUrlRequest {
  string photo_id = 1;
  string collection_id = 2;
}

message GetPhotoDownloadUrlResponse {
  string download_url = 1;
}

message UpdateSidecarRequest {
  string photo_id = 1;
  string analysis_status = 3;
  string card_name = 4;
  string card_number = 5;
  string set_name = 6;
  string rarity = 7;
  reserved 8, 9, 10;
  reserved "confidence", "reasoning_summary", "detected_text";
  string error_message = 11;
  string review_status = 12;
  string language = 13;
  string collection_id = 14;
}

message UpdateSidecarResponse {
  bool success = 1;
}

message UpdateSetNameRequest {
  string photo_id = 1;
  string set_name = 3;
  string collection_id = 4;
}

message UpdateSetNameResponse {
  bool success = 1;
}

message UpdateCardNumberRequest {
  string photo_id = 1;
  string card_number = 3;
  string collection_id = 4;
}

message UpdateCardNumberResponse {
  bool success = 1;
}

message UpdateCardLanguageRequest {
  string photo_id = 1;
  string language = 3;
  string collection_id = 4;
}

message UpdateCardLanguageResponse {
  bool success = 1;
}

message UpdateReviewStatusRequest {
  string photo_id = 1;
  string review_status = 3;
  string collection_id = 4;
}

message UpdateReviewStatusResponse {
  bool success = 1;
}

// Safety net for sidecar records written in an older shape (e.g. missing analysis_status).
// Scans DynamoDB for such records and repairs them; a no-op for records already current.
message MigrateSidecarsRequest {
}

message MigrateSidecarsResponse {
  int32 total_files = 1;
  int32 migrated = 2;
  int32 already_current = 3;
  int32 errors = 4;
}

message DeletePhotoRequest {
  string photo_id = 1;
  string collection_id = 2;
}

message DeletePhotoResponse {
  bool success = 1;
}

// Re-runs AI Analysis on one already-stored photo and replaces its sidecar's analysis result. The
// photo's review_status is preserved and a verified photo's series/card number stay pinned. A
// transport-level Gemini failure aborts with UNAVAILABLE and leaves the sidecar untouched.
message ReanalyzePhotoRequest {
  string photo_id = 1;
  string collection_id = 2;
}

message ReanalyzePhotoResponse {
  CardEntry card = 1;
}
